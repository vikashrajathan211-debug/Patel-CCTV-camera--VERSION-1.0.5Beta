name: Build Patel CCTV Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Web Assets and Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Typecheck
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK and Bundle
        working-directory: android
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug assembleRelease bundleRelease || ./gradlew assembleDebug
          else
            gradle assembleDebug assembleRelease bundleRelease || gradle assembleDebug
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patel-CCTV-Camera-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Google Play Store Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patel-CCTV-Camera-Bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
